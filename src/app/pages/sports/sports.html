<div class="content-body">
  <div class="action-row">
    <div class="left-actions">
      <button class="btn-pill" type="button">Sport</button>
    </div>
  </div>

  <div class="stats-grid">
    <div class="stat-card">
      <span class="stat-val">52</span>
      <span class="stat-lbl">SPORTS</span>
    </div>
    <div class="stat-card">
      <span class="stat-val">241</span>
      <span class="stat-lbl">MAIN ENTITIES</span>
    </div>
    <div class="stat-card">
      <span class="stat-val">1.347</span>
      <span class="stat-lbl">COMPETITIONS</span>
    </div>
    <div class="stat-card">
      <span class="stat-val">12.456</span>
      <span class="stat-lbl">PARTICIPANTS</span>
    </div>
  </div>

  <div class="table-container">
    <table class="data-table">
      <thead>
      <tr>
        <th>Sport</th>
        <th>Main Entities</th>
        <th>Competitions</th>
        <th>Participants</th>
        <th class="text-right">Actions</th>
      </tr>
      </thead>
      <tbody>
        @for (item of sportsList(); track item.name) {
          <tr>
            <td class="name-col">
              <span class="emoji">{{ item.icon }}</span>
              <span class="sport-name">{{ item.name }}</span>
            </td>
            <td>{{ item.mainEntities }}</td>
            <td>{{ item.competitions }}</td>
            <td>{{ item.participants }}</td>
            <td class="text-right actions-cell">
              <button class="icon-btn" type="button" title="Edit">✏️</button>
              <button class="icon-btn delete-btn" type="button" title="Delete">🗑️</button>
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
